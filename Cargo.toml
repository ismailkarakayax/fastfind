[package]
name = "fastfind"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Blazing fast, parallel file name search for the command line"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ismailkarakayax/fastfind"
keywords = ["find", "search", "files", "cli", "parallel"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anstream = "1"
anstyle = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
globset = "0.4"
ignore = "0.4.23"
regex = "1.11"

# Desktop app (only built with `--features gui`)
eframe = { version = "0.37", features = ["persistence"], optional = true }
rfd = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sys-locale = { version = "0.3", optional = true }

[features]
gui = ["dep:eframe", "dep:rfd", "dep:serde", "dep:sys-locale"]

[[bin]]
name = "fastfind"
path = "src/main.rs"

[[bin]]
name = "fastfind-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
